<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>नयाँ स्कूल कोड खरिद — SSMS App</title>
<style>
  :root { --navy:#152a6e; --navy-dark:#0f1f52; --purple:#6d28d9; --line:#dfe3ef; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: linear-gradient(180deg,#f5f7fd,#e3e9fb);
    color: var(--navy-dark); font-family: -apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
    display: flex; justify-content: center; padding: 40px 16px;
  }
  main { width: 100%; max-width: 440px; }
  .logo { text-align:center; font-weight:800; font-size:1.4rem; color:var(--navy); margin-bottom:4px; }
  .tag { text-align:center; color:#6b7794; font-size:.85rem; margin-bottom:28px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:0 8px 24px rgba(21,42,110,.06); margin-bottom:16px; }
  h1 { font-size:1.05rem; margin:0 0 4px; color:var(--navy); }
  p.sub { margin:0 0 20px; color:#6b7794; font-size:.85rem; line-height:1.5; }
  label { display:block; font-size:.78rem; font-weight:700; margin-bottom:6px; color:#3a4468; }
  input { width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px; font-size:.95rem; margin-bottom:16px; background:#f9fafe; }
  .price { text-align:center; background:#f3edfd; border:1px solid #e2d4fb; border-radius:12px; padding:12px; margin-bottom:16px; font-weight:800; color:var(--purple); font-size:1.1rem; }
  .methods { display:flex; gap:8px; margin-bottom:18px; }
  .m { flex:1; border:1.5px solid var(--line); border-radius:10px; padding:10px 4px; text-align:center; font-weight:700; font-size:.85rem; cursor:pointer; color:#3a4468; }
  .m.active { border-color:var(--purple); background:#f3edfd; color:var(--purple); }
  button.pay { width:100%; padding:14px; border:none; border-radius:12px; background:linear-gradient(135deg,var(--purple),#4c1d95); color:#fff; font-size:1rem; font-weight:800; cursor:pointer; }
  button.pay:disabled { opacity:.55; }
  .status { text-align:center; font-size:.85rem; font-weight:700; margin-bottom:10px; min-height:1.2em; }
  .status.err { color:#c0392b; }
  .status.ok { color:#1f8a5c; }
  .result { display:none; background:#eafbf2; border:1px solid #bdf0d4; border-radius:12px; padding:16px; font-size:.85rem; line-height:1.8; }
  .result b { color:var(--navy); }
  .foot { text-align:center; font-size:.75rem; color:#8894b3; margin-top:18px; }
  .foot a { color:var(--navy); }
</style>
</head>
<body>
<main>
  <div class="logo">🏫 SSMS App</div>
  <div class="tag">School Management System</div>

  <div class="card" id="formCard">
    <h1>नयाँ स्कूल कोड खरिद</h1>
    <p class="sub">आफ्नो विद्यालयको जानकारी भरेर तुरुन्त School Code प्राप्त गर्नुहोस्। भुक्तानी पछि तपाईंलाई यहीं Principal, Teacher, र Parent code देखाइनेछ।</p>

    <label for="sName">विद्यालयको नाम</label>
    <input id="sName" placeholder="उदाहरण: Shree Janata Secondary School" />

    <label for="sLoc">ठेगाना</label>
    <input id="sLoc" placeholder="उदाहरण: Kathmandu" />

    <div class="price">रु. ५,००० — पहिलो ३० दिन सक्रियता</div>

    <label>भुक्तानी विधि</label>
    <div class="methods">
      <div class="m active" data-method="esewa" id="mEsewa">eSewa</div>
      <div class="m" data-method="khalti" id="mKhalti">Khalti</div>
    </div>

    <button class="pay" id="payBtn">भुक्तानी गरी कोड प्राप्त गर्नुहोस्</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card result" id="resultCard"></div>

  <div class="foot">पहिले नै School Code छ? <a href="./renew.html">यहाँबाट नवीकरण गर्नुहोस्</a></div>
</main>

<script>
  const FUNCTION_URL = "https://icfxffduambqlbivowzs.supabase.co/functions/v1/web-school-purchase";
  let method = "esewa";

  document.getElementById("mEsewa").onclick = () => selectMethod("mEsewa", "esewa");
  document.getElementById("mKhalti").onclick = () => selectMethod("mKhalti", "khalti");
  function selectMethod(id, m) {
    method = m;
    document.querySelectorAll(".m").forEach(el => el.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  function submitEsewaForm(esewaForm) {
    const form = document.createElement("form");
    form.method = esewaForm.method || "POST";
    form.action = esewaForm.action;
    for (const [name, value] of Object.entries(esewaForm.fields)) {
      const input = document.createElement("input");
      input.type = "hidden"; input.name = name; input.value = value;
      form.appendChild(input);
    }
    document.body.appendChild(form);
    form.submit();
  }

  const statusEl = document.getElementById("status");
  const btn = document.getElementById("payBtn");

  btn.addEventListener("click", async () => {
    const school_name = document.getElementById("sName").value.trim();
    const location = document.getElementById("sLoc").value.trim();
    if (!school_name || !location) {
      statusEl.textContent = "कृपया विद्यालयको नाम र ठेगाना भर्नुहोस्।";
      statusEl.className = "status err";
      return;
    }
    btn.disabled = true;
    statusEl.className = "status";
    statusEl.textContent = "तयार गर्दैछ...";

    try {
      const res = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ school_name, location, method, return_url: window.location.href })
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        statusEl.textContent = "त्रुटि: " + (data.error || res.status);
        statusEl.className = "status err";
        btn.disabled = false;
        return;
      }

      // Save the new code locally so we can show it after the eSewa/Khalti redirect
      // sends the person back here (their code is already active in the database
      // by the time they return, regardless of what this browser tab remembers).
      sessionStorage.setItem("ssms_new_code", data.invite_code);

      statusEl.textContent = "सफल! भुक्तानी पेजमा लैजाँदैछ...";
      statusEl.className = "status ok";
      if (data.esewa_form) {
        setTimeout(() => submitEsewaForm(data.esewa_form), 500);
      } else if (data.checkout_url) {
        setTimeout(() => { window.location.href = data.checkout_url; }, 500);
      }
    } catch (e) {
      statusEl.textContent = "Network error, फेरि प्रयास गर्नुहोस्।";
      statusEl.className = "status err";
      btn.disabled = false;
    }
  });

  // If we're coming back from a payment redirect (same tab, same origin), sessionStorage
  // still has the code we generated just before leaving for eSewa/Khalti -- show it.
  const savedCode = sessionStorage.getItem("ssms_new_code");
  if (savedCode) {
    document.getElementById("formCard").style.display = "none";
    const resultCard = document.getElementById("resultCard");
    resultCard.style.display = "block";
    resultCard.innerHTML = "<b>तपाईंको School Code:</b> " + savedCode +
      "<br>App मा गएर यही code ले Principal login गर्नुहोस्। भुक्तानी पुष्टि हुन केही मिनेट लाग्न सक्छ।";
    sessionStorage.removeItem("ssms_new_code");
  }
</script>
</body>
</html>
