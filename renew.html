<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>सदस्यता नवीकरण — SSMS</title>
<style>
:root { --navy:#152a6e; --navy-dark:#0f1f52; --green:#1f8a5c; --bg:#eef2fb; --line:#dfe3ef; }
* { box-sizing: border-box; }
body {
margin: 0; background: linear-gradient(180deg,#f5f7fd,#e3e9fb);
color: var(--navy-dark); font-family: -apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
display: flex; justify-content: center; padding: 40px 16px;
}
main { width: 100%; max-width: 440px; }
.logo { display:flex; align-items:center; justify-content:center; gap:10px; font-weight:800; font-size:1.25rem; color:var(--navy); margin-bottom:4px; }
.logo img { width:34px; height:34px; border-radius:9px; object-fit:cover; flex-shrink:0; }
.tag { text-align:center; color:#6b7794; font-size:.85rem; margin-bottom:28px; }
.card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:0 8px 24px rgba(21,42,110,.06); margin-bottom:16px; }
h1 { font-size:1.05rem; margin:0 0 4px; color:var(--navy); }
p.sub { margin:0 0 20px; color:#6b7794; font-size:.85rem; line-height:1.5; }
label { display:block; font-size:.78rem; font-weight:700; margin-bottom:6px; color:#3a4468; }
input { width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px; font-size:.95rem; margin-bottom:16px; background:#f9fafe; }
.plans { display:flex; gap:10px; margin-bottom:16px; }
.plan { flex:1; border:1.5px solid var(--line); border-radius:12px; padding:12px 8px; text-align:center; cursor:pointer; transition:.15s; }
.plan.active { border-color:var(--green); background:#eafbf2; }
.plan .amt { font-weight:800; color:var(--green); font-size:1.02rem; margin:2px 0; }
.plan .lbl { font-size:.72rem; color:#6b7794; font-weight:700; }
.methods { display:flex; gap:8px; margin-bottom:18px; }
.m { flex:1; border:1.5px solid var(--line); border-radius:10px; padding:10px 4px; text-align:center; font-weight:700; font-size:.85rem; cursor:pointer; color:#3a4468; }
.m.active { border-color:var(--navy); background:#eef1fc; color:var(--navy); }
button.pay { width:100%; padding:14px; border:none; border-radius:12px; background:linear-gradient(135deg,var(--navy),var(--navy-dark)); color:#fff; font-size:1rem; font-weight:800; cursor:pointer; }
button.pay:disabled { opacity:.55; }
.status { text-align:center; font-size:.85rem; font-weight:700; margin-bottom:10px; min-height:1.2em; }
.status.err { color:#c0392b; }
.status.ok { color:var(--green); }
.foot { text-align:center; font-size:.75rem; color:#8894b3; margin-top:18px; }
.foot a { color:var(--navy); }
</style>
</head>
<body>
<main>
<div class="logo"><img src="assets/ssms-logo.jpg" alt="SSMS logo"> SSMS</div>
<div class="tag">Smart Student Monitor System — विद्यालयका लागि सेवा</div>
<div class="card">
<h1>सदस्यता नवीकरण</h1>
<p class="sub">आफ्नो विद्यालयको School Code प्रविष्ट गरेर सदस्यता नवीकरण गर्नुहोस्।</p>
<label for="code">School Code</label>
<input id="code" placeholder="उदाहरण: SCH-10492" autocapitalize="characters" />
<label>योजना छान्नुहोस्</label>
<div class="plans">
<div class="plan active" data-amount="5000" id="planMonthly">
<div class="lbl">मासिक</div>
<div class="amt">रु. ५,०००</div>
<div class="lbl">+३० दिन</div>
</div>
<div class="plan" data-amount="50000" id="planYearly">
<div class="lbl">वार्षिक</div>
<div class="amt">रु. ५०,०००</div>
<div class="lbl">+१ वर्ष</div>
</div>
</div>
<label>भुक्तानी विधि</label>
<div class="methods">
<div class="m active" data-method="cips" id="mCips"><img src="assets/connectips-logo.png" alt="">connectIPS</div>
<div class="m" data-method="qr" id="mQr">Bank QR</div>
</div>
<button class="pay" id="payBtn">connectIPS बाट भुक्तानी गर्नुहोस्</button>
<div class="status" id="status"></div>
</div>
<div class="card qrcard" id="qrCard"></div>
<div class="foot">समस्या भएमा सम्पर्क गर्नुहोस् · <a href="./index.html">SSMS होमपेजमा फर्कनुहोस्</a></div>
</main>
<script src="assets/web-pay.js"></script>
<script>
let amount = 5000;
let method = "cips";
const $ = id => document.getElementById(id);
const statusEl = $("status");
const btn = $("payBtn");
$("planMonthly").onclick = () => selectPlan("planMonthly", 5000);
$("planYearly").onclick = () => selectPlan("planYearly", 50000);
$("mCips").onclick = () => selectMethod("mCips", "cips");
$("mQr").onclick = () => selectMethod("mQr", "qr");
function selectPlan(id, amt) {
  amount = amt;
  document.querySelectorAll(".plan").forEach(el => el.classList.remove("active"));
  $(id).classList.add("active");
}
function selectMethod(id, m) {
  method = m;
  document.querySelectorAll(".m").forEach(el => el.classList.remove("active"));
  $(id).classList.add("active");
  btn.textContent = m === "cips" ? "connectIPS बाट भुक्तानी गर्नुहोस्" : "Bank QR देखाउनुहोस्";
}
function fail(msg) { statusEl.textContent = msg; statusEl.className = "status err"; btn.disabled = false; }
btn.addEventListener("click", async () => {
  const code = $("code").value.trim().toUpperCase();
  if (!code) { fail("कृपया School Code प्रविष्ट गर्नुहोस्।"); return; }
  btn.disabled = true; statusEl.className = "status"; statusEl.textContent = "जाँच गर्दैछ...";
  try {
    const s = await SSMSPay.prep({ action: "lookup_school", school_code: code });
    if (!s.ok) {
      fail(s.error === "School not found" ? "यो School Code भेटिएन। कृपया फेरि जाँच्नुहोस्।" : ("त्रुटि: " + (s.error || s._status)));
      return;
    }
    const note = amount === 50000 ? "वार्षिक (+१ वर्ष)" : "मासिक (+३० दिन)";
    if (method === "cips") {
      statusEl.textContent = "विद्यालय: " + s.school_name_masked + " — connectIPS खोल्दैछ...";
      const p = await SSMSPay.startConnectIps({ schoolId: s.school_id, schoolCode: s.school_code, amount, purpose: "MEMBERSHIP_RENEWAL" });
      if (!p.ok) { fail("त्रुटि: " + p.error); return; }
      statusEl.className = "status ok";
      setTimeout(p.go, 500);
    } else {
      statusEl.textContent = "";
      const card = document.querySelector("main > .card"); card.style.display = "none";
      const qc = $("qrCard"); qc.style.display = "block";
      await SSMSPay.renderQrCard(qc, {
        amount, amountNote: s.school_name_masked + " · " + note,
        onSubmit: ref => SSMSPay.prep({ action: "qr_claim", school_id: s.school_id, purpose: "MEMBERSHIP_RENEWAL", amount, reference: ref }),
        onBack: () => { qc.style.display = "none"; card.style.display = "block"; btn.disabled = false; }
      });
    }
  } catch (e) { fail("Network error, फेरि प्रयास गर्नुहोस्।"); }
});
</script>
</body>
</html>
